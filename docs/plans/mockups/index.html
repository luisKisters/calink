<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calink — UI Directions</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  body { display:flex; flex-direction:column; background:#0b0b0f; }
  .switcher {
    display:flex; align-items:center; gap:6px; padding:10px 16px;
    background:#15151c; border-bottom:1px solid #26262f; flex-shrink:0;
  }
  .brand { color:#fff; font-weight:700; font-size:15px; margin-right:14px; letter-spacing:-.3px; }
  .brand span { color:#7c6cff; }
  .switcher button {
    appearance:none; border:1px solid transparent; background:transparent;
    color:#9a9aab; font-size:13px; padding:7px 13px; border-radius:8px; cursor:pointer;
    transition:.15s; font-weight:500; white-space:nowrap;
  }
  .switcher button:hover { color:#fff; background:#22222c; }
  .switcher button.active { color:#fff; background:#2e2a4d; border-color:#4a3fb0; }
  .hint { margin-left:auto; color:#55555f; font-size:12px; }
  iframe { flex:1; width:100%; border:0; background:#fff; }
</style>
</head>
<body>
  <nav class="switcher">
    <div class="brand">cal<span>ink</span></div>
    <button data-src="1-command.html" class="active">1 · Command</button>
    <button data-src="2-editorial.html">2 · Editorial</button>
    <button data-src="3-playful.html">3 · Playful</button>
    <button data-src="4-dashboard.html">4 · Dashboard</button>
    <button data-src="5-chat.html">5 · Chat-native</button>
    <div class="hint">5 completely different UI directions — same product</div>
  </nav>
  <iframe id="stage" src="1-command.html"></iframe>
  <script>
    const stage = document.getElementById('stage');
    document.querySelectorAll('.switcher button').forEach(b => {
      b.addEventListener('click', () => {
        document.querySelectorAll('.switcher button').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        stage.src = b.dataset.src;
      });
    });
  </script>
</body>
</html>
